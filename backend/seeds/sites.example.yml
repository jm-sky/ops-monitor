# Example sites seed file.
# Copy to seeds/sites.yml (gitignored) and fill in real values.
# Run: docker exec ops-monitor-app python -m cli monitor seed-sites seeds/sites.yml --no-dry-run --no-clear
#
# App health polls use GET /api/health/details (Ops Monitor contract).
# Set token from HEALTH_DETAILS_TOKEN (same value as the site's bearer token).

sites:
  - name: ovh-v3
    description: Host agent — health + system (not app /health/details)
    server_label: ovh-v3
    environment: production
    health_url: http://agent:9100/health
    system_url: http://agent:9100/system
    token: ""  # AGENT_TOKEN
    enabled: true
    polling_health: 60
    polling_system: 300

  - name: ops-monitor
    description: Ops Monitor
    server_label: ovh-v3
    environment: production
    health_url: https://ops-monitor.dev-made.it/api/health/details
    system_url: ""
    token: ""
    enabled: false
    polling_health: 300

  - name: gear-stack
    description: Gear Stack
    environment: production
    health_url: https://api.gear-stack.ovh/api/health/details
    system_url: ""
    token: ""
    enabled: false
    polling_health: 300

