services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: ops-monitor-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ops_monitor}
      - POSTGRES_USER=${POSTGRES_USER:-backend}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ops_monitor_postgres_data:/var/lib/postgresql/data
    # Ports intentionally not exposed — access via docker exec or app container only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ops-monitor-network

  # Redis (for token blacklist and challenge storage)
  redis:
    image: redis:8-alpine
    container_name: ops-monitor-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    # Ports intentionally not exposed — access via app container only
    volumes:
      - ops_monitor_redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $${REDIS_PASSWORD:-changeme} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ops-monitor-network

  # Application (Development Mode)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ops-monitor-backend:dev
    container_name: ops-monitor-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PROJECT_NAME=${PROJECT_NAME:-ops-monitor}
      - APP_PORT=${APP_PORT:-8000}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-backend}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-ops_monitor}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5176"]}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5176}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI}
      - FACEBOOK_OAUTH_CLIENT_ID=${FACEBOOK_OAUTH_CLIENT_ID}
      - FACEBOOK_OAUTH_CLIENT_SECRET=${FACEBOOK_OAUTH_CLIENT_SECRET}
      - FACEBOOK_OAUTH_REDIRECT_URI=${FACEBOOK_OAUTH_REDIRECT_URI}
      - RECAPTCHA_ENABLED=${RECAPTCHA_ENABLED:-false}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"  # Only localhost access (Caddy proxy)
    volumes:
      # Mount source code for hot reload
      # Paths are relative to docker-compose.dev.yml location (backend/ directory)
      - ./app:/app/app:rw,delegated
      - ./scripts:/app/scripts:rw,delegated
      - ./tests:/app/tests:rw,delegated
      - ./migrations:/app/migrations:rw,delegated
      - ./main.py:/app/main.py:rw,delegated
      - ./cli:/app/cli:ro,delegated
      - ./cli.py:/app/cli.py:ro,delegated
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ops-monitor-network

networks:
  ops-monitor-network:
    name: ops-monitor-network

volumes:
  ops_monitor_postgres_data:
    name: ops_monitor_postgres_data
  ops_monitor_redis_data:
    name: ops_monitor_redis_data
