services:
  agent:
    image: ops-monitor-agent
    build: .
    container_name: ops-monitor-agent
    restart: unless-stopped
    ports:
      # Host loopback only — Docker publishes past UFW when bound to 0.0.0.0
      - "127.0.0.1:${AGENT_PORT:-9100}:${AGENT_PORT:-9100}"
    env_file:
      - .env
    volumes:
      - /var/lib/apt/lists:/var/lib/apt/lists:ro
      - /var/lib/update-notifier:/var/lib/update-notifier:ro
      - /var/run:/host/var/run:ro
    networks:
      ops-monitor-network:
        aliases:
          - agent

networks:
  ops-monitor-network:
    name: ops-monitor-network
    external: true
