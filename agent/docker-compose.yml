services:
  agent:
    image: ops-monitor-agent
    build: .
    container_name: ops-monitor-agent
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-9100}:${AGENT_PORT:-9100}"
    env_file:
      - .env
    volumes:
      - /var/lib/apt/lists:/var/lib/apt/lists:ro
      - /var/lib/update-notifier:/var/lib/update-notifier:ro
      - type: bind
        source: /var/run/reboot-required
        target: /var/run/reboot-required
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/reboot-required.pkgs
        target: /var/run/reboot-required.pkgs
        read_only: true
        bind:
          create_host_path: false
    networks:
      - ops-monitor-network

networks:
  ops-monitor-network:
    name: ops-monitor-network
    external: true
